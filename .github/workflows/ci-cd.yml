name: CI e deploy do BoFlix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe e arquivos essenciais
        run: |
          node --check script.js
          test -s index.html
          test -s style.css
          test -s nos.html
          test -s assets/logo.png
      - name: Preparar arquivos do site
        if: github.event_name == 'push'
        run: |
          mkdir public
          cp ./*.html ./*.css ./*.js public/
          cp -R assets public/
      - name: Preparar Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Enviar artefato do site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Validacao do gatilho de pull request.
